<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zapytanie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff0f5;
      text-align: center;
      padding-top: 40px;
    }
    button {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      padding: 12px 20px;
      margin: 10px;
    }
    img {
      max-width: 200px;
    }
  </style>
</head>
<body>

  <img id="mainImage" src="https://media1.tenor.com/m/zgYEGB6L5ooAAAAd/hi-hello.gif" />

  <h1 id="question">Hejka 👋</h1>

  <div>
    <button id="yesBtn" style="background-color: green; color: white;">Hej</button>
    <button id="noBtn" style="background-color: red; color: white;">Spadaj</button>
  </div>

  <script>
    const noPhrases = [
      "Nie 💔",
      "Proszę? 🥺",
      "Jeszcze jedna szansa?",
      "Może warto się zastanowić? 🤭",
      "Nie do końca? 😌",
      "Chyba się wahasz? 😇",
      "Dajmy temu drugą szansę! 🥺",
      "Hmm, może się nad tym zastanów? 😄",
      "Proszę? 🥺",
      "Może jednak warto spróbować? 🙂",
      "Jeszcze chwila na decyzję? 😅",
      "Chwila namysłu nie zaszkodzi 🤭",
      "Może jednak?",
      "Nie do końca powiedziane 'nie'? 😌",
    ];

    let noClicks = 0;
    let stage = "start";

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const question = document.getElementById("question");
    const image = document.getElementById("mainImage");

    function resetButtons() {
      noClicks = 0;
      yesBtn.style.fontSize = "18px";
      noBtn.textContent = "Nie";
      yesBtn.textContent = "Tak";
      noBtn.style.display = "inline-block";
      yesBtn.style.display = "inline-block";
    }

    noBtn.addEventListener("click", () => {
      if (stage === "start") {
        image.src = "https://media1.tenor.com/m/vmAUYtK36rMAAAAC/flowers-valentine.gif";
        question.textContent = "Rozumiem. Mimo to życzę Ci miłego dnia 😊";
        noBtn.style.display = "none";
        yesBtn.style.display = "none";
        return;
      }

      if (stage === "polska") {
        stage = "francja";
        question.textContent = "Będziesz we Francji?";
        image.src = "https://media1.tenor.com/m/uXC1GUAtlrwAAAAC/cat-devon-rex-paris-france-eiffel-tower-beret-hat-bonjour-cute.gif";
        resetButtons();
        return;
      }

      if (stage === "francja") {
        // jeśli użytkownik mówi NIE → pytanie o spotkanie w Polsce
        stage = "spotkanie_w_polsce";
        question.textContent = "Może chciałabyś się jednak spotkać w tym czasie w Polsce?";
        resetButtons();
        return;
      }

      if (stage === "spotkanie_w_polsce") {
        // jeśli użytkownik mówi NIE → koniec
        stage = "koniec";
        question.textContent = "Rozumiem. Mimo to życzę Ci miłego dnia 😊";
        noBtn.style.display = "none";
        yesBtn.style.display = "none";
        return;
      }

      if (stage === "walentynki_plany") {
        noClicks++;
        noBtn.textContent = noPhrases[Math.min(noClicks, noPhrases.length - 1)];
        yesBtn.style.fontSize = (18 + noClicks * 6) + "px";
      }
    });

    yesBtn.addEventListener("click", () => {
      if (stage === "start") {
        stage = "polska";
        image.src = "https://media1.tenor.com/m/cbG6dP8SWZgAAAAC/think-deep.gif";
        question.textContent = "Czy 14 lutego będziesz w Polsce?";
        resetButtons();
        return;
      }

      if (stage === "polska") {
        stage = "walentynka";
        question.textContent = "Czy zostaniesz moją walentynką?";
        resetButtons();
        return;
      }

      if (stage === "francja") {
        // jeśli użytkownik mówi TAK → wątek dodatkowego pytania
        stage = "dodatkowe_pytanie";
        question.textContent = "Szkoda, a mogę zadać Ci pytanie dodatkowe?";
        resetButtons();
        return;
      }

      if (stage === "spotkanie_w_polsce") {
        // jeśli użytkownik mówi TAK → pytanie o plany na Walentynki
        stage = "walentynki_plany";
        question.textContent = "A posiadasz jakieś plany na Walentynki?";
        resetButtons();
        return;
      }

      if (stage === "walentynki_plany") {
        // jeśli użytkownik mówi TAK → Mam nadzieję, że spędzisz miło ten dzień
        stage = "walentynka";
        question.textContent = "Mam nadzieję, że spędzisz miło ten dzień 💖";
        resetButtons();
        return;
      }

      if (stage === "walentynka" || stage === "walentynka_po_powrocie") {
        image.src = "https://media.tenor.com/f1xnRxTRxLAAAAAj/bears-with-kisses-bg.gif";
        question.textContent = "Yay!!! 💖🎉";
        noBtn.style.display = "none";
        yesBtn.style.display = "none";
      }
    });
  </script>

</body>
</html>
