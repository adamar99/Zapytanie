<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zapytanie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff0f5;
      text-align: center;
      padding-top: 40px;
    }
    button {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      padding: 12px 20px;
      margin: 10px;
    }
    img {
      max-width: 200px;
    }
  </style>
</head>
<body>

  <img id="mainImage" src="https://media1.tenor.com/m/zgYEGB6L5ooAAAAd/hi-hello.gif" />

  <h1 id="question">Hejka 👋</h1>

  <div>
    <button id="yesBtn" style="background-color: green; color: white;">Hej</button>
    <button id="noBtn" style="background-color: red; color: white;">Spadaj</button>
  </div>

  <script>
    const noPhrases = [
      "Nie 💔", 
      "Proszę? 🥺", 
      "Jeszcze jedna szansa?", 
      "Może warto się zastanowić? 🤭", 
      "Nie do końca? 😌", 
      "Chyba się wahasz? 😇", 
      "Dajmy temu drugą szansę! 🥺", 
      "Hmm, może się nad tym zastanów? 😄", 
      "Proszę? 🥺", 
      "Może jednak warto spróbować? 🙂", 
      "Jeszcze chwila na decyzję? 😅", 
      "Chwila namysłu nie zaszkodzi 🤭", 
      "Może jednak?", 
      "Nie do końca powiedziane 'nie'? 😌",
    ];

    let noClicks = 0;
    let stage = "start";

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const question = document.getElementById("question");
    const image = document.getElementById("mainImage");

    function resetButtons() {
      noClicks = 0;
      yesBtn.style.fontSize = "18px";
      noBtn.textContent = "Nie";
      yesBtn.textContent = "Tak";
      noBtn.style.display = "inline-block";
      yesBtn.style.display = "inline-block";
    }

    noBtn.addEventListener("click", () => {
      if (stage === "start") {
        image.src = "https://media1.tenor.com/m/vmAUYtK36rMAAAAC/flowers-valentine.gif";
        question.textContent = "Rozumiem. Mimo to życzę Ci miłego dnia 😊";
        noBtn.style.display = "none";
        yesBtn.style.display = "none";
        return;
      }

      if (stage === "polska") {
        stage = "francja";
        image.src = "https://media1.tenor.com/m/uXC1GUAtlrwAAAAC/cat-devon-rex-paris-france-eiffel-tower-beret-hat-bonjour-cute.gif";
        question.textContent = "Będziesz we Francji?";
        resetButtons();
        return;
      }

      if (stage === "francja") {
        // Jeśli NIE → pytanie o spotkanie w Polsce
        stage = "spotkanie_w_polsce";
        image.src = "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExYm55ZTF3eDB6eTZ2NXJ3OHo2dHhnZHBkaGQxeXNsZmh6cGszZWhxdyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xT0xeuOy2Fcl9vDGiA/giphy.gif";
        question.textContent = "Może chciałabyś się jednak spotkać w tym czasie w Polsce?";
        resetButtons();
        return;
      }

      if (stage === "spotkanie_w_polsce") {
        // NIE → zakończenie
        stage = "koniec";
        image.src = "https://media1.tenor.com/m/vmAUYtK36rMAAAAC/flowers-valentine.gif";
        question.textContent = "Rozumiem. Mimo to życzę Ci miłego dnia 😊";
        noBtn.style.display = "none";
        yesBtn.style.display = "none";
        return;
      }

      if (stage === "walentynki_plany") {
        // NIE → pytanie o bycie walentynką
        stage = "walentynka";
        image.src = "https://media1.tenor.com/m/FprPSoVq8cYAAAAC/blushing-in-love.gif";
        question.textContent = "Czy chciałabyś zostać moją walentynką?";
        resetButtons();
        return;
      }

      if (stage === "walentynka" || stage === "walentynka_po_powrocie") {
        noClicks++;
        noBtn.textContent = noPhrases[Math.min(noClicks, noPhrases.length - 1)];
        yesBtn.style.fontSize = (18 + noClicks * 22) + "px";
        return;
      }

      if (stage === "dodatkowe_pytanie") {
        image.src = "https://media1.tenor.com/m/vmAUYtK36rMAAAAC/flowers-valentine.gif";
        question.textContent = "Rozumiem. Życzę Ci miłego wyjazdu i miłego dnia 😊";
        noBtn.style.display = "none";
        yesBtn.style.display = "none";
        return;
      }
    });

    yesBtn.addEventListener("click", () => {
      if (stage === "start") {
        stage = "polska";
        image.src = "https://media1.tenor.com/m/cbG6dP8SWZgAAAAC/think-deep.gif";
        question.textContent = "Czy 14 lutego będziesz w Polsce?";
        resetButtons();
        return;
      }

      if (stage === "polska") {
        stage = "walentynka";
        image.src = "https://media1.tenor.com/m/FprPSoVq8cYAAAAC/blushing-in-love.gif";
        question.textContent = "Czy chciałabyś zostać moją walentynką?";
        resetButtons();
        return;
      }

      if (stage === "francja") {
        stage = "dodatkowe_pytanie";
        image.src = "https://media1.tenor.com/m/EvaDjfSXdPEAAAAC/buttefly-images.gif";
        question.textContent = "Szkoda, a mogę zadać Ci pytanie dodatkowe?";
        resetButtons();
        return;
      }

      if (stage === "spotkanie_w_polsce") {
        stage = "walentynki_plany";
        image.src = "https://media.tenor.com/QKSv39O825sAAAAi/bubu-dudu-sseeyall.gif";
        question.textContent = "A posiadasz jakieś plany na Walentynki?";
        resetButtons();
        return;
      }

      if (stage === "walentynki_plany") {
        // TAK → koniec, życzenia miłego dnia
        stage = "koniec_milego_dnia";
        image.src = "https://media1.tenor.com/m/vmAUYtK36rMAAAAC/flowers-valentine.gif";
        question.textContent = "Mam nadzieję, że spędzisz miło ten dzień 💖";
        noBtn.style.display = "none";
        yesBtn.style.display = "none";
        return;
      }

      if (stage === "walentynka" || stage === "walentynka_po_powrocie") {
        image.src = "https://media.tenor.com/VIChDQ6ejRQAAAAj/jumping-bear-hearts-no-png.gif";
        question.textContent = "Yay!!! 💖🎉";
        noBtn.style.display = "none";
        yesBtn.style.display = "none";
        return;
      }

      if (stage === "dodatkowe_pytanie") {
        stage = "walentynka_po_powrocie";
        image.src = "https://media1.tenor.com/m/FprPSoVq8cYAAAAC/blushing-in-love.gif";
        question.textContent = "Czy zostaniesz moją Walentynką po powrocie do Polski?";
        resetButtons();
        return;
      }
    });
  </script>

</body>
</html>
